[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbom-security"
version = "0.1.0"
description = "Report the dependencies of a package or repository and the known vulnerabilities affecting them"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "httpx",
    "packageurl-python",
    "fastapi",
    "uvicorn",
    "arq",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pylint",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Async tests are run without needing a decorator on each one.
asyncio_mode = "auto"
